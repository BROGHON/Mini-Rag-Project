services:
  mongodb:
    image: mongo:8.3
    container_name: mongodb
    ports:
      - "27007:27017"

    volumes:
      - mongodb_data:/data/db
    
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}

    
    networks:
      - backend

    restart: unless-stopped

volumes:
  mongodb_data:

networks:
  backend: